name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest
      - name: Validate committed evidence
        run: |
          python -m eval.evidence validate --run-dir evidence/debug-v1/random
          python -m eval.evidence validate --run-dir evidence/debug-v1/material
          python -m eval.evidence validate --run-dir evidence/baseline-v1/random
          python -m eval.evidence validate --run-dir evidence/baseline-v1/material
          python -m eval.evidence validate --run-dir evidence/distill-v1/random
          python -m eval.evidence validate --run-dir evidence/distill-v1/material
          python -m eval.evidence validate --run-dir evidence/distill-v1/vs-debug
          python -m eval.evidence validate --run-dir evidence/distill-v1/pikafish-depth-1
          python -m eval.evidence validate --run-dir evidence/distill-v1/pikafish-depth-2
          python -m eval.evidence validate --run-dir evidence/distill-v1/pikafish-depth-4
          python -m eval.evidence validate --run-dir evidence/distill-v2/random
          python -m eval.evidence validate --run-dir evidence/distill-v2/material
          python -m eval.evidence validate --run-dir evidence/distill-v2/vs-v1
          python -m eval.evidence validate --run-dir evidence/distill-v2/pikafish-depth-1
          python -m eval.evidence validate --run-dir evidence/distill-v2/pikafish-depth-2
          python -m eval.evidence validate --run-dir evidence/distill-v2/pikafish-depth-4
          python -m eval.evidence validate --run-dir evidence/distill-v1-long/random
          python -m eval.evidence validate --run-dir evidence/distill-v1-long/material
          python -m eval.evidence validate --run-dir evidence/distill-v1-long/vs-v1
          python -m eval.evidence validate --run-dir evidence/distill-v1-long/pikafish-depth-1
          python -m eval.evidence validate --run-dir evidence/distill-v1-long/pikafish-depth-2
          python -m eval.evidence validate --run-dir evidence/distill-v1-long/pikafish-depth-4
          python -m eval.evidence validate --run-dir evidence/distill-v3/random
          python -m eval.evidence validate --run-dir evidence/distill-v3/material
          python -m eval.evidence validate --run-dir evidence/distill-v3/vs-v1
          python -m eval.evidence validate --run-dir evidence/distill-v3/vs-half-data
          python -m eval.evidence validate --run-dir evidence/distill-v3/pikafish-depth-1
          python -m eval.evidence validate --run-dir evidence/distill-v3/pikafish-depth-2
          python -m eval.evidence validate --run-dir evidence/distill-v3/pikafish-depth-4
          python -m eval.evidence validate --run-dir evidence/distill-v3-half-data/vs-v1
          python -m eval.evidence validate --run-dir evidence/distill-v3-half-epochs/vs-v1
          python -m eval.evidence validate --run-dir evidence/distill-v3-half-epochs/vs-half-data
          python -m eval.evidence validate --run-dir evidence/distill-v4/random
          python -m eval.evidence validate --run-dir evidence/distill-v4/material
          python -m eval.evidence validate --run-dir evidence/distill-v4/vs-v3
          python -m eval.evidence validate --run-dir evidence/distill-v4/vs-v1
          python -m eval.evidence validate --run-dir evidence/distill-v4/pikafish-depth-1
          python -m eval.evidence validate --run-dir evidence/distill-v4/pikafish-depth-2
          python -m eval.evidence validate --run-dir evidence/distill-v4/pikafish-depth-4
          python -m eval.evidence validate --run-dir evidence/distill-v4-half-epochs/vs-v3
          python -m eval.evidence validate --run-dir evidence/distill-v4-large/random
          python -m eval.evidence validate --run-dir evidence/distill-v4-large/material
          python -m eval.evidence validate --run-dir evidence/distill-v4-large/vs-v4
          python -m eval.evidence validate --run-dir evidence/distill-v4-large/pikafish-depth-1
          python -m eval.evidence validate --run-dir evidence/distill-v4-large/pikafish-depth-2
          python -m eval.evidence validate --run-dir evidence/distill-v4-large/pikafish-depth-4
      - name: Build and inspect package
        if: matrix.python-version == '3.12'
        run: python scripts/release_check.py
